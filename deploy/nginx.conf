# /etc/nginx/sites-available/bhavishya — installed by setup-server.sh, which
# fills in SERVER_NAMES and APP. certbot (enable-https.sh) adds the HTTPS block.
#
#   /api/*, /django-admin/*  -> Django (gunicorn, 127.0.0.1:8000)
#   /static/*                -> Django admin's collected static files
#   /api/media/public/*      -> note images, straight from disk
#   everything else          -> Next.js (127.0.0.1:3000)
#
# Study-material files (media/private/) are deliberately NOT served here: they
# only leave the server through Django's signed, access-checked links.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name SERVER_NAMES;

    # Material uploads are capped at 25 MB by Django; bulk-import JSON at 20 MB.
    client_max_body_size 30M;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /static/ {
        alias APP/backend/staticfiles/;
        expires 30d;
        access_log off;
    }

    location ^~ /api/media/public/ {
        alias APP/backend/media/public/;
        expires 7d;
        add_header X-Content-Type-Options nosniff always;
    }

    location ~ ^/(api|django-admin)/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
