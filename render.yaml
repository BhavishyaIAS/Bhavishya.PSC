# Render Blueprint: the API + database half of the temporary hosting
# (website on Vercel, see deploy/VERCEL-RENDER.md). Render → New → Blueprint →
# pick this repo; it creates both and asks for ADMIN_EMAIL / ADMIN_PASSWORD.
#
# Free plan: the API sleeps after 15 idle minutes (the keep-awake workflow pings
# it), local files are wiped on restart, and the database expires after 30 days.
databases:
  - name: bhavishya-db
    plan: free
    region: singapore
    databaseName: bhavishya
    user: bhavishya

services:
  - type: web
    name: bhavishya-api
    runtime: python
    plan: free
    region: singapore
    branch: main
    rootDir: backend
    buildCommand: bash render-build.sh
    startCommand: gunicorn config.wsgi:application --workers 2 --bind 0.0.0.0:$PORT --timeout 120
    healthCheckPath: /api/commissions/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bhavishya-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      # Requests arrive for the Render host (server-side calls from Vercel) or
      # proxied through the Vercel site's /api rewrite.
      - key: ALLOWED_HOSTS
        value: ".onrender.com,.vercel.app,localhost,127.0.0.1"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com,https://*.vercel.app"
      - key: COOKIE_SECURE
        value: "true"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
