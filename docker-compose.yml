# Local PostgreSQL for development:  docker compose up -d db
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bhavishya
      POSTGRES_PASSWORD: bhavishya
      POSTGRES_DB: bhavishya
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bhavishya"]
      interval: 3s
      retries: 20
volumes:
  pgdata:
